[package]
name = "token-automation"
version = "0.1.0"
description = "MetaPilot Token Swap and Trading Automation Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_automation"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["no-idl"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["dex"] }
solana-program = "1.18"
borsh = "0.10"
arrayref = "0.3"
num-derive = "0.4"
num-traits = "0.2"
